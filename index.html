    <script type="text/javascript">
        const selectButton = document.getElementById('app-header-language-select');
        const languageDropdown = document.getElementById('app-header-language-dropdown');
        const exitButton = document.getElementById('app-header-exit-button');

        selectButton.addEventListener('click', () => {
            if (languageDropdown.hasAttribute('open')) {
                languageDropdown.close();
            } else {
                languageDropdown.show();
            }
        });

        // will break if content is replaced dynamically, as it should be.
        if (exitButton) {
            if (['/logout'].includes(window.location.pathname)) {
                exitButton.style.display = 'none';
            } else {
                exitButton.addEventListener(
                    'click',
                    () => (window.location.pathname = '/logout')
                );
            }
        }

        languageDropdown.addEventListener('click', (e) => e.stopPropagation());
    </script>

        <button id="login-form-send-button" class="ui-button" type="submit" size="xl">Войти</button>

        <script type="text/javascript">
            // Флаг для проверки отправки формы
            const button = document.getElementById('login-form-send-button');
            const form = document.getElementById("fm1");

            // Подсветка ошибок только при сабмите
            button.addEventListener('click', (event) => {
                    event.preventDefault();

                    let hasEmpty = false;

                    form.querySelectorAll('.ui-textfield__input[required]').forEach((input) => {
                        const errorDiv = input.parentElement.querySelector('.ui-textfield__error');
                        if (!input.value.trim()) {
                            errorDiv.style.display = 'block';
                            input.classList.add('ui-textfield__input_touched');
                            hasEmpty = true;
                        } else {
                            errorDiv.style.display = 'none';
                            input.classList.remove('ui-textfield__input_touched');
                        }
                    });

                    if (!hasEmpty) {
                        button.disabled = true;
                        form.submit();
                    }
                });

            // Скрыть "Обязательное поле" при начале ввода
            document.querySelectorAll('.ui-textfield__input[required]').forEach((input) => {
                input.addEventListener('input', (event) => {
                    const errorDiv = event.target.parentElement.querySelector('.ui-textfield__error');
                    if (event.target.value.trim()) {
                        errorDiv.style.display = 'none';
                        event.target.classList.remove('ui-textfield__input_touched');
                    }
                });
            });

            // Проверка Caps Lock при вводе пароля
            const passwordInput = document.getElementById('login-form-password-input');
            const capsLockHint = passwordInput.parentElement.querySelector('.ui-textfield__hint');

            passwordInput.addEventListener('keyup', (event) => {
                if (event.getModifierState && event.getModifierState('CapsLock')) {
                    capsLockHint.style.display = 'block';
                } else {
                    capsLockHint.style.display = 'none';
                }
            });

            // Просмотр пароля и смена svg
            const togglePasswordButton = document.querySelector(
                '#login-form-password-input + .ui-textfield__end'
            );
            const eyeIcon = togglePasswordButton.querySelector('img');

            togglePasswordButton.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.src = "\/images\/icons\/icon-eye-off.svg";
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.src = "\/images\/icons\/icon-eye.svg";
                }
            });
        </script>
    </form>
